services:
  optimize.host:
    image: optimize.host
    build:
      context: .
      dockerfile: Optimize.Host/Dockerfile
    ports:
      - "5000:5000"
    
  postgres:
    image: postgres-18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: optimize
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

